# Updates the Apps Script server whenever server or shared code changes on main.
# One-time setup: docs/SETUP.md, "Automatic server updates" (two secrets in the "production" environment).
# The secrets live in an environment that only the main branch may use, so a workflow on any other
# branch cannot read them: only merged code can deploy.
name: Deploy server

on:
  push:
    branches: [main]
    paths: ['server/**', 'shared/**', 'client/js/config.js', '.github/workflows/deploy-server.yml']
  workflow_dispatch: {}          # also runnable by hand: Actions tab -> Deploy server -> Run workflow

concurrency: deploy-server        # never two deploys at once

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production       # holds CLASPRC_JSON and SCRIPT_ID; restricted to main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the secrets are set
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then
            echo "::error::Automatic deploys are not set up yet: add the CLASPRC_JSON and SCRIPT_ID secrets (docs/SETUP.md, 'Automatic server updates')."
            exit 1
          fi

      - name: Make sure the server has the latest shared code
        run: bash tools/sync_server.sh

      - name: Run the tests (nothing is deployed if they fail)
        run: |
          node tools/test.js
          node tools/test_world.js

      - name: Upload the code to Apps Script
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > server/.clasp.json
          cd server
          npx --yes @google/clasp@2.4.2 push --force

      - name: Publish a new version of the web app (same URL)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          # the web app's deployment id is the part of API_URL between /s/ and /exec
          DEPLOYMENT_ID=$(grep -o 'macros/s/[^/]*/exec' client/js/config.js | cut -d/ -f3)
          if [ -z "$DEPLOYMENT_ID" ]; then echo "::error::No web app address in client/js/config.js yet. The code was uploaded; now create the first deployment in Apps Script (Deploy > New deployment > Web app) and put its URL in API_URL."; exit 1; fi
          cd server
          npx --yes @google/clasp@2.4.2 deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"

      - name: Clear the server's cached game data
        run: |
          URL=$(grep -o "https://script.google.com/macros/s/[^']*/exec" client/js/config.js)
          curl -sSL "$URL?action=reload" || true
