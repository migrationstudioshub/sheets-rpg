<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheets RPG · Content Studio</title>
<style>
  :root { color-scheme: dark; --bg: #14161b; --panel: #1b1e25; --line: #2c313c; --text: #e6e4df; --dim: #9a978f;
          --accent: #4ea1ff; --warn: #f2c14e; --bad: #ff8a7a; --good: #7fcf8f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  body { display: grid; grid-template: "top top" auto "nav main" 1fr / 200px 1fr; height: 100%; }
  #top { grid-area: top; display: flex; gap: 10px; align-items: center; padding: 7px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #top .title { font-weight: 600; } #top .lbl { color: var(--dim); } #top .sp { margin-left: auto; }
  button, select, input, textarea { font: inherit; color: var(--text); background: #262a33; border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
  button { cursor: pointer; } button:hover { border-color: #46506a; }
  button.primary { background: #3d6fb6; border-color: #3d6fb6; color: #fff; }
  button.ghost { background: transparent; }
  input, select, textarea { width: 100%; } input[type=checkbox] { width: auto; }
  #nav { grid-area: nav; background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 8px; }
  #nav button { display: flex; justify-content: space-between; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 6px; padding: 6px 8px; margin-bottom: 2px; }
  #nav button.on { background: #2f4f7a; } #nav button .n { color: var(--dim); }
  #main { grid-area: main; display: grid; grid-template-columns: 280px 1fr; min-height: 0; }
  #list { border-right: 1px solid var(--line); overflow: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  #list .head { display: flex; gap: 6px; margin-bottom: 4px; }
  #list .rec { display: flex; gap: 8px; align-items: center; text-align: left; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: #20242d; }
  #list .rec.on { background: #2f4f7a; border-color: var(--accent); }
  #list .rec small { color: var(--dim); }
  #list .rec .rbody { min-width: 0; overflow: hidden; }
  #list .rthumb { width: 28px; height: 28px; flex: none; object-fit: contain; image-rendering: pixelated; background: #14161b; border-radius: 4px; }
  #list .rthumb.ph { border: 1px dashed var(--line); background: transparent; }   /* no art yet */
  #list .listgroup { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin: 10px 2px 2px; }
  #list .listgroup:first-of-type { margin-top: 2px; }
  /* Base Tile / Autotile segmented toggle (terrain form) */
  #form .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  #form .seg .segbtn { border: 0; border-radius: 0; background: #262a33; color: var(--text); padding: 5px 14px; cursor: pointer; }
  #form .seg .segbtn + .segbtn { border-left: 1px solid var(--line); }
  #form .seg .segbtn.on { background: #3d6fb6; color: #fff; }
  #form { overflow: auto; padding: 14px 16px; }
  #form .field { margin-bottom: 10px; max-width: 540px; }
  #form label { display: block; color: var(--dim); font-size: 12px; margin-bottom: 3px; }
  #form .help { color: var(--dim); font-size: 11px; margin-top: 2px; }
  #form textarea { resize: vertical; min-height: 54px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  #form .row { display: flex; gap: 8px; align-items: center; }
  #form .formhead { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
  #form .formhead h2 { font-size: 15px; margin: 0; }
  #form .lootrow { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; max-width: 540px; }
  #form .lootrow input { width: auto; }
  #form .lootlbl { color: var(--dim); font-size: 11px; }
  #form .sub { margin: 16px 0 6px; font-size: 12px; font-weight: 600; color: var(--text); border-top: 1px solid var(--line); padding-top: 12px; max-width: 540px; }
  #form details { max-width: 540px; margin-top: 16px; border-top: 1px solid var(--line); padding-top: 10px; }
  #form details > summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 8px; user-select: none; }
  #form .kprop { margin-bottom: 8px; }
  #form .kprop > label { display: flex; align-items: center; gap: 4px; color: var(--text); margin-bottom: 3px; }
  #form .kprop > label .lootlbl { margin-left: auto; }
  #form .layer { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; max-width: 540px; background: #191c23; }
  #form .layer .lhead { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  #form .layer .lhead input[type=number] { width: 58px; }
  #form .layer .lhead button { padding: 4px 8px; }
  #form .lsub { color: var(--dim); font-size: 11px; margin: 8px 0 4px; }
  #form .layer select { width: auto; max-width: 140px; }
  #form .preview { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; max-width: 540px; }
  #form canvas.pv { width: 64px; height: 96px; background: #0e1014; border: 1px solid var(--line); border-radius: 6px; image-rendering: pixelated; }
  #form .layer .ltype { width: auto; min-width: 92px; }
  #form .pct { width: 48px; text-align: right; }
  /* visual dropdown (sprite thumbnail / colour swatch + name) */
  #form .pickwrap { position: relative; flex: 1; min-width: 0; }
  #form .picker { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; padding: 3px 6px; }
  #form .picker .picklabel { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #form .picker .caret { color: var(--dim); }
  #form .thumb { width: 24px; height: 24px; flex: none; object-fit: contain; image-rendering: pixelated; background: #0e1014; border-radius: 3px; }
  #form .thumb.ph { border: 1px dashed var(--line); background: transparent; }
  /* light checkerboard so line-art sprites (e.g. black hair) stay visible, not lost on dark */
  #form .thumb.lit { background-color: #c8ccd2;
    background-image: linear-gradient(45deg, #9aa0a8 25%, transparent 25%, transparent 75%, #9aa0a8 75%),
                      linear-gradient(45deg, #9aa0a8 25%, transparent 25%, transparent 75%, #9aa0a8 75%);
    background-size: 8px 8px; background-position: 0 0, 4px 4px; }
  #form .swatch { width: 24px; height: 16px; flex: none; border-radius: 3px; border: 1px solid rgba(255,255,255,.15); }
  #form .swatch.none { background: repeating-linear-gradient(45deg, #2a2a2a 0 4px, #1b1b1b 4px 8px); }
  #form .pickpop { display: none; position: absolute; z-index: 50; left: 0; top: 100%; margin-top: 2px; width: max(220px, 100%);
    max-height: 260px; overflow: auto; background: #20242d; border: 1px solid var(--accent); border-radius: 8px; padding: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  #form .pickwrap.open .pickpop { display: block; }
  #form .pickitem { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  #form .pickitem:hover { background: #2f4f7a; }
  #form .pickitem.on { outline: 1px solid var(--accent); }
  /* /art file browser (collapsible folder tree) + inline image preview */
  #form .pickpop.art { width: max(340px, 100%); max-height: 340px; }
  #form .picksearch { width: 100%; margin-bottom: 4px; }
  #form .pickfolder { display: flex; align-items: center; gap: 4px; padding: 3px 6px; border-radius: 6px; cursor: pointer; color: var(--dim); font-size: 12px; user-select: none; }
  #form .pickfolder:hover { background: #2a2f3a; color: var(--text); }
  #form .pickfolder .tw { width: 12px; flex: none; text-align: center; }
  #form .imagefield { display: flex; flex-direction: column; gap: 6px; }
  #form .imagefield .row { display: flex; gap: 6px; align-items: center; }
  #form .imagefield .row > input { flex: 1; min-width: 0; }
  #form .imgprev { width: 72px; height: 72px; object-fit: contain; image-rendering: pixelated; background: #0e1014; border: 1px solid var(--line); border-radius: 6px; }
  /* whole-sheet preview for an autotile terrain (below its picker), like the Base Tile preview */
  #form .autoprev { display: block; max-width: 100%; max-height: 240px; width: auto; height: auto; margin-top: 6px;
    object-fit: contain; image-rendering: pixelated; background: #0e1014; border: 1px solid var(--line); border-radius: 6px; }
  /* hover-to-zoom popup for small sprite thumbnails (held ~1s) */
  .sprhover { position: fixed; z-index: 2000; display: none; pointer-events: none; padding: 4px; border: 1px solid var(--accent);
    border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.6); background-color: #c8ccd2;
    background-image: linear-gradient(45deg, #9aa0a8 25%, transparent 25%, transparent 75%, #9aa0a8 75%),
                      linear-gradient(45deg, #9aa0a8 25%, transparent 25%, transparent 75%, #9aa0a8 75%);
    background-size: 14px 14px; background-position: 0 0, 7px 7px; }
  .sprhover img { display: block; width: 160px; height: 160px; object-fit: contain; image-rendering: pixelated; }
  .note { color: var(--dim); font-size: 12px; }
  .status .dirty { color: var(--warn); } .status .clean { color: var(--good); } .status .bad { color: var(--bad); }
  .empty { color: var(--dim); padding: 24px; }
  .pill { font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 10px; padding: 1px 7px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; width: 360px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  .modal .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
</style>
</head>
<body>
  <div id="top"></div>
  <div id="nav"></div>
  <div id="main"><div id="list"></div><div id="form"></div></div>

  <script>
    (function () {
      var files = ['../shared/schema.js', '../client/js/config.js', '../client/js/content_store.js', '../client/js/tint.js', 'js/cstudio.js'];
      var v = Date.now();
      (function next(i) {
        if (i >= files.length) { if (window.CStudio) CStudio.init(); return; }
        var s = document.createElement('script');
        s.src = files[i] + '?v=' + v;
        s.onload = function () { next(i + 1); };
        s.onerror = function () { document.getElementById('top').textContent = 'could not load ' + files[i]; };
        document.body.appendChild(s);
      })(0);
    })();
  </script>
</body>
</html>
