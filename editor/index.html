<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheets RPG · Map editor</title>
<style>
  :root { color-scheme: dark; --bg: #14161b; --panel: #1b1e25; --line: #2c313c; --text: #e6e4df; --dim: #9a978f;
          --accent: #4ea1ff; --warn: #f2c14e; --bad: #ff8a7a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  body { display: grid; grid-template: "top top top" auto "left main right" 1fr "bottom bottom bottom" auto / 260px 1fr 300px; }
  #toolbar { grid-area: top; display: flex; gap: 14px; align-items: center; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #toolbar .group { display: flex; gap: 4px; align-items: center; }
  #toolbar .right { margin-left: auto; }
  #toolbar .lbl { color: var(--dim); margin-right: 4px; }
  #toolbar .ico { display: inline-block; width: 1em; text-align: center; }
  .layer { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .layer button { border: 0; border-radius: 0; }
  .layer.on button { background: #2f4f7a; }
  .eye { width: 26px; padding: 3px 0 !important; }
  button, select, input, textarea { font: inherit; color: var(--text); background: #262a33; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  button { cursor: pointer; }
  button:hover { border-color: #46506a; }
  button.on, .tool.on { background: #2f4f7a; border-color: #3f679e; }
  button.primary { background: #3d6fb6; border-color: #3d6fb6; color: #fff; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  input, select, textarea { width: 100%; }
  input[type=checkbox] { width: auto; }
  input.num { width: 64px; }
  aside { background: var(--panel); overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
  #left { grid-area: left; border-right: 1px solid var(--line); }
  #right { grid-area: right; border-left: 1px solid var(--line); }
  main { grid-area: main; position: relative; overflow: hidden; }
  canvas#canvas { position: absolute; inset: 0; display: block; }
  #cellinfo { position: absolute; left: 10px; bottom: 8px; background: rgba(16,18,22,.85); padding: 3px 8px; border-radius: 6px; color: var(--dim); pointer-events: none; }
  #status { grid-area: bottom; display: flex; gap: 14px; padding: 4px 10px; background: var(--panel); border-top: 1px solid var(--line); color: var(--dim); }
  #status .mode { padding: 0 8px; border-radius: 10px; background: #2a2e37; }
  #status .dirty { color: var(--warn); } #status .clean { color: #7fcf8f; } #status .bad { color: var(--bad); }
  #status .right { margin-left: auto; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 6px; }
  h3 { margin: 0; font-size: 14px; }
  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .row label { width: 48px; color: var(--dim); }
  .row.small { color: var(--dim); font-size: 12px; }
  .buttons { flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; margin-bottom: 6px; }
  .tabs button { flex: 1; }
  .items { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; margin: 6px 0; max-height: 46vh; overflow: auto; }
  .item { display: flex; align-items: center; gap: 6px; text-align: left; padding: 3px; overflow: hidden; }
  .item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item.on { background: #2f4f7a; border-color: var(--accent); }
  .kind { grid-column: 1 / -1; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-top: 6px; }
  canvas.thumb { image-rendering: pixelated; border-radius: 3px; flex: none; }
  .form { display: flex; flex-direction: column; gap: 8px; }
  .head { display: flex; gap: 10px; align-items: center; }
  .field label { display: block; color: var(--dim); font-size: 12px; margin-bottom: 2px; }
  .field.check { display: flex; gap: 6px; align-items: center; }
  .field.check label { margin: 0; color: var(--text); font-size: 13px; }
  .inline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .note { color: var(--dim); font-size: 12px; }
  .sub { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; border-top: 1px solid var(--line); padding-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
  .chip { background: #3a3220; color: var(--warn); border-radius: 10px; padding: 1px 8px; font-size: 12px; }
  img.preview { display: block; width: 48px; height: 48px; margin-top: 4px; image-rendering: pixelated; background: #262a33; border-radius: 4px; }
  .pick { border: 1px solid var(--warn); border-radius: 8px; padding: 10px; }
  .help table { border-collapse: collapse; margin-top: 8px; }
  .help td { padding: 2px 6px 2px 0; color: var(--dim); }
  .help td.k { color: var(--text); white-space: nowrap; }
  /* gear maker view: covers the editing row (left + main + right) */
  #gearview { grid-area: 2 / 1 / 3 / 4; display: none; min-height: 0; background: var(--bg); z-index: 1; }
  #gearview.shown, #gearview[style*="flex"] { display: flex; }
  .gearform { width: 340px; flex: none; overflow: auto; padding: 12px; border-right: 1px solid var(--line); background: var(--panel); }
  .gearform textarea { resize: vertical; }
  .gearout { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
  .gearcard { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--panel); display: flex; flex-direction: column; gap: 8px; }
  .gearcard-head { color: var(--dim); }
  .gearreview { max-width: 100%; image-rendering: pixelated; border-radius: 4px; background: #3a3632; }
  .gearrow { margin: 0; padding: 8px; background: #14161b; border-radius: 6px; color: var(--text); white-space: pre-wrap; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  .geartints .chips { align-items: center; }
  .geartints .chip { cursor: pointer; border: 1px solid var(--line); }
</style>
</head>
<body>
  <div id="toolbar"></div>
  <aside id="left">
    <section><h2>Map</h2><div id="maps"></div></section>
    <section><h2>Palette</h2><div id="palette"></div></section>
  </aside>
  <main><canvas id="canvas"></canvas><div id="cellinfo"></div></main>
  <aside id="right"><section id="inspector"></section></aside>
  <div id="status">loading…</div>

  <script>
    // Load the code without the browser cache, so an update shows up on the next reload.
    (function () {
      var files = ['../shared/content.js', '../shared/autotile.js', '../shared/rules.js', '../shared/world.js', '../client/js/config.js',
                   '../client/js/assets.js', '../client/js/render.js', '../client/js/tint.js', 'js/store.js', 'js/panels.js', 'js/editor.js', 'js/gear.js'];
      var v = Date.now();
      (function next(i) {
        if (i >= files.length) return;
        var s = document.createElement('script');
        s.src = files[i] + '?v=' + v;
        s.onload = function () { next(i + 1); };
        s.onerror = function () { document.getElementById('status').textContent = 'could not load ' + files[i]; };
        document.body.appendChild(s);
      })(0);
    })();
  </script>
</body>
</html>
