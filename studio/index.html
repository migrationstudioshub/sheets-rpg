<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheets RPG · Asset Studio</title>
<style>
  :root { color-scheme: dark; --bg: #14161b; --panel: #1b1e25; --line: #2c313c; --text: #e6e4df; --dim: #9a978f;
          --accent: #4ea1ff; --warn: #f2c14e; --bad: #ff8a7a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  /* studio layout: a top tab bar and a single full-height maker view */
  body { display: flex; flex-direction: column; }
  #studiobar { display: flex; gap: 14px; align-items: center; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #studiobar .group { display: flex; gap: 4px; align-items: center; }
  #studiobar .right { margin-left: auto; }
  #studiobar .lbl { color: var(--dim); }
  .layer { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .layer button { border: 0; border-radius: 0; }
  button, select, input, textarea { font: inherit; color: var(--text); background: #262a33; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  button { cursor: pointer; }
  button:hover { border-color: #46506a; }
  button.on { background: #2f4f7a; border-color: #3f679e; }
  button.primary { background: #3d6fb6; border-color: #3d6fb6; color: #fff; }
  input, select, textarea { width: 100%; }
  input[type=checkbox] { width: auto; }
  canvas.thumb { image-rendering: pixelated; border-radius: 3px; flex: none; }
  .form { display: flex; flex-direction: column; gap: 8px; }
  .field label { display: block; color: var(--dim); font-size: 12px; margin-bottom: 2px; }
  .field.check { display: flex; gap: 6px; align-items: center; }
  .field.check label { margin: 0; color: var(--text); font-size: 13px; }
  .inline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .note { color: var(--dim); font-size: 12px; }
  .note.dirty { color: var(--warn); } .note.clean { color: #7fcf8f; } .note.bad { color: var(--bad); }
  .sub { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; border-top: 1px solid var(--line); padding-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
  .chip { background: #3a3220; color: var(--warn); border-radius: 10px; padding: 1px 8px; font-size: 12px; }
  .pick { border: 1px solid var(--warn); border-radius: 8px; padding: 10px; }
  /* the maker views (moved from the editor): fill the area under the tab bar */
  #gearview, #tilesetview, #objectsview { display: none; flex: 1; min-height: 0; background: var(--bg); }
  #gearview[style*="flex"], #tilesetview[style*="flex"], #objectsview[style*="flex"] { display: flex; }
  .gearprev { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .gearform { width: 340px; flex: none; overflow: auto; padding: 12px; border-right: 1px solid var(--line); background: var(--panel); }
  .gearform textarea { resize: vertical; }
  .gearout { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
  .gearcard { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--panel); display: flex; flex-direction: column; gap: 8px; }
  .gearcard-head { color: var(--dim); }
  .gearreview { max-width: 100%; image-rendering: pixelated; border-radius: 4px; background: #3a3632; }
  .gearrow { margin: 0; padding: 8px; background: #14161b; border-radius: 6px; color: var(--text); white-space: pre-wrap; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  .geartints .chips { align-items: center; }
  .geartints .chip { cursor: pointer; border: 1px solid var(--line); }
</style>
</head>
<body>
  <div id="studiobar"></div>

  <script>
    // Load the code without the browser cache, so an update shows up on the next reload.
    (function () {
      var files = ['../client/js/tint.js', 'js/studio.js', 'js/gear.js', 'js/tileset.js', 'js/objects.js'];
      var v = Date.now();
      (function next(i) {
        if (i >= files.length) { if (window.Studio) Studio.init(); return; }
        var s = document.createElement('script');
        s.src = files[i] + '?v=' + v;
        s.onload = function () { next(i + 1); };
        s.onerror = function () { document.getElementById('studiobar').textContent = 'could not load ' + files[i]; };
        document.body.appendChild(s);
      })(0);
    })();
  </script>
</body>
</html>
